name: README cards

on:
  workflow_dispatch:
  push:
    paths:
      - .github/gen-svg.py
      - hypr/.config/hypr/variables.lua
      - .github/workflows/readme-cards.yml

permissions:
  contents: write

# Two pushes in a row must not race each other on the commit.
concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # stdlib only, the runner's python3 is enough
      - name: Render cards
        run: python3 .github/gen-svg.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/assets
          git diff --cached --quiet || (git commit -m "Updated README cards" && git push)
