<svg xmlns="http://www.w3.org/2000/svg" width="840" height="456" viewBox="0 0 840 456" role="img" aria-label="Packages"><title>Packages</title><style>text{font-family:'Google Sans Flex','Google Sans','Segoe UI',Roboto,sans-serif}
.up{animation:up .8s cubic-bezier(.05,.7,.1,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.34,1.56,.64,1) both}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.spin-r{transform-box:fill-box;transform-origin:center;animation:spin 28s linear infinite reverse}
.blink{animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="840" height="456" rx="28" fill="#2d2832"/><text x="44" y="56" fill="#eadfed" class="up" style="font-size:26px;font-weight:700">Packages</text><text x="796" y="56" fill="#cec2d4" text-anchor="end" class="up" style="font-size:15px">one folder = one stow package</text><g class="pop" style="animation-delay:0.10s"><rect x="44" y="84" width="248" height="76" rx="20" fill="#38323d"/><circle cx="72" cy="122" r="8" fill="#dcb8ff"/><text x="94" y="118" fill="#eadfed" style="font-size:17px;font-weight:650">hypr</text><text x="94" y="140" fill="#cec2d4" style="font-size:14px">Hyprland, Lua config</text></g><g class="pop" style="animation-delay:0.15s"><rect x="304" y="84" width="248" height="76" rx="20" fill="#38323d"/><circle cx="332" cy="122" r="8" fill="#dcb8ff"/><text x="354" y="118" fill="#eadfed" style="font-size:17px;font-weight:650">caelestia</text><text x="354" y="140" fill="#cec2d4" style="font-size:14px">shell + CLI</text></g><g class="pop" style="animation-delay:0.20s"><rect x="564" y="84" width="248" height="76" rx="20" fill="#38323d"/><circle cx="592" cy="122" r="8" fill="#dcb8ff"/><text x="614" y="118" fill="#eadfed" style="font-size:17px;font-weight:650">quickshell</text><text x="614" y="140" fill="#cec2d4" style="font-size:14px">QML widgets</text></g><g class="pop" style="animation-delay:0.25s"><rect x="44" y="172" width="248" height="76" rx="20" fill="#38323d"/><circle cx="72" cy="210" r="8" fill="#dcb8ff"/><text x="94" y="206" fill="#eadfed" style="font-size:17px;font-weight:650">fuzzel</text><text x="94" y="228" fill="#cec2d4" style="font-size:14px">app launcher</text></g><g class="pop" style="animation-delay:0.30s"><rect x="304" y="172" width="248" height="76" rx="20" fill="#38323d"/><circle cx="332" cy="210" r="8" fill="#dcb8ff"/><text x="354" y="206" fill="#eadfed" style="font-size:17px;font-weight:650">foot · kitty · alacritty</text><text x="354" y="228" fill="#cec2d4" style="font-size:14px">terminals</text></g><g class="pop" style="animation-delay:0.35s"><rect x="564" y="172" width="248" height="76" rx="20" fill="#38323d"/><circle cx="592" cy="210" r="8" fill="#dcb8ff"/><text x="614" y="206" fill="#eadfed" style="font-size:17px;font-weight:650">fish</text><text x="614" y="228" fill="#cec2d4" style="font-size:14px">main shell</text></g><g class="pop" style="animation-delay:0.40s"><rect x="44" y="260" width="248" height="76" rx="20" fill="#38323d"/><circle cx="72" cy="298" r="8" fill="#dcb8ff"/><text x="94" y="294" fill="#eadfed" style="font-size:17px;font-weight:650">starship</text><text x="94" y="316" fill="#cec2d4" style="font-size:14px">prompt</text></g><g class="pop" style="animation-delay:0.45s"><rect x="304" y="260" width="248" height="76" rx="20" fill="#38323d"/><circle cx="332" cy="298" r="8" fill="#dcb8ff"/><text x="354" y="294" fill="#eadfed" style="font-size:17px;font-weight:650">zsh · bash</text><text x="354" y="316" fill="#cec2d4" style="font-size:14px">fallback shells</text></g><g class="pop" style="animation-delay:0.50s"><rect x="564" y="260" width="248" height="76" rx="20" fill="#38323d"/><circle cx="592" cy="298" r="8" fill="#dcb8ff"/><text x="614" y="294" fill="#eadfed" style="font-size:17px;font-weight:650">git</text><text x="614" y="316" fill="#cec2d4" style="font-size:14px">gitconfig + global ignore</text></g><g class="pop" style="animation-delay:0.55s"><rect x="44" y="348" width="248" height="76" rx="20" fill="#38323d"/><circle cx="72" cy="386" r="8" fill="#dcb8ff"/><text x="94" y="382" fill="#eadfed" style="font-size:17px;font-weight:650">btop · fastfetch · cava</text><text x="94" y="404" fill="#cec2d4" style="font-size:14px">eye candy</text></g><g class="pop" style="animation-delay:0.60s"><rect x="304" y="348" width="248" height="76" rx="20" fill="#38323d"/><circle cx="332" cy="386" r="8" fill="#dcb8ff"/><text x="354" y="382" fill="#eadfed" style="font-size:17px;font-weight:650">micro</text><text x="354" y="404" fill="#cec2d4" style="font-size:14px">editor</text></g><g class="pop" style="animation-delay:0.65s"><rect x="564" y="348" width="248" height="76" rx="20" fill="#6700b6"/><circle cx="592" cy="386" r="8" fill="#dcb8ff"/><text x="614" y="382" fill="#efdbff" style="font-size:17px;font-weight:650">stow */</text><text x="614" y="404" fill="#efdbff" style="font-size:14px">link them all</text></g></svg>